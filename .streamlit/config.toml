[theme]
base = "light"
primaryColor = "#5BA7D6"
backgroundColor = "#F6F3E6"
secondaryBackgroundColor = "#FCE0D3"
textColor = "#24232B"
blueColor = "#6398A9"
greenColor = "#4F8875"
orangeColor = "#D58B35"
redColor = "#5BA7D6"
grayColor = "#7A8793"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = [800, 750, 700, 700, 700, 700]
baseFontSize = 16
baseRadius = "large"
buttonRadius = "full"
borderColor = "#C9D9EA"
showWidgetBorder = true
showSidebarBorder = false

[browser]
gatherUsageStats = false

[server]
# Transformers exposes optional vision modules that need torchvision, even though
# TripSync only uses text embeddings. Disable Streamlit's module watcher to keep
# it from probing those optional modules; restart Streamlit after code changes.
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
